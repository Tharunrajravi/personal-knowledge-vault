name: Deploy Backend

# Triggers on every push to main that touches the backend folder
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:  # allow manual trigger from GitHub UI

env:
  AWS_REGION:       ap-south-1
  ECR_REPOSITORY:   pkv-backend
  ECS_CLUSTER:      pkv-cluster
  ECS_SERVICE:      pkv-api-service
  TASK_DEFINITION:  pkv-api

jobs:
  deploy:
    name: Build → ECR → ECS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ───────────────────────────────────────
      # These come from GitHub repo secrets (Settings → Secrets → Actions)
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY were generated by 02_iam.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Log in to ECR ───────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build Docker image ──────────────────────────────────────────────
      # Tag with both the git commit SHA (for traceability) and 'latest'
      - name: Build Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:     ${{ github.sha }}
        run: |
          cd backend
          docker build \
            --target final \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 5. Push to ECR ─────────────────────────────────────────────────────
      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:     ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✓ Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ── 6. Download current task definition ────────────────────────────────
      # We fetch the live task definition and only update the image URI
      # All other settings (CPU, memory, env vars, secrets) stay unchanged
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION \
            --query taskDefinition \
            --output json > /tmp/task-definition.json
          echo "✓ Task definition downloaded"

      # ── 7. Update image in task definition ────────────────────────────────
      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition.json
          container-name:  pkv-api
          image:           ${{ steps.build.outputs.image }}

      # ── 8. Deploy to ECS ───────────────────────────────────────────────────
      # Rolling deploy: new tasks start → health check passes → old tasks stop
      # Circuit breaker: if new tasks fail health check → auto rollback
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:    ${{ steps.task-def.outputs.task-definition }}
          service:            ${{ env.ECS_SERVICE }}
          cluster:            ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true  # pipeline waits until deploy is done

      # ── 9. Notify success ──────────────────────────────────────────────────
      - name: Deploy summary
        run: |
          echo "## Backend Deploy Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.build.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | \`${{ env.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ env.ECS_SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
