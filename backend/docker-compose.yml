version: '3.8'

# ══════════════════════════════════════════════════════════════════
# Local development stack
# Mirrors production as closely as possible:
#   - Same PostgreSQL version (16) as RDS
#   - Same Redis version (7) as ElastiCache
#   - App reads from .env file (same config.py logic)
#
# Usage:
#   docker-compose up -d        # start all services
#   docker-compose up app       # start only the app (with deps)
#   docker-compose logs -f app  # tail app logs
#   docker-compose down -v      # stop and delete volumes
# ══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pkv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pkv_db
      POSTGRES_USER: pkvadmin
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"          # exposed for local tools (DBeaver, psql)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkvadmin -d pkv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pkv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"          # exposed for local inspection (redis-cli)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI App ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: pkv-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.local           # local overrides (see .env.local.example)
    environment:
      # Override SSM loading — use direct values for local dev
      DB_URL: postgresql+asyncpg://pkvadmin:localpassword@db:5432/pkv_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      JWT_SECRET: "local-dev-secret-change-in-production"
      AWS_REGION: ap-south-1
      SES_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Hot reload: mount source code so changes reflect without rebuild
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    name: pkv-pgdata
  redisdata:
    name: pkv-redisdata
